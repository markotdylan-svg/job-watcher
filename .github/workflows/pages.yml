name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily run"]
    types: [completed]
  workflow_dispatch:
    inputs:
      include_data:
        description: "Copy data/history.csv and data/status.json into the site"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # after a daily run, deploy the commit it just pushed
      - name: Assemble site with the data files
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          if [ "${{ inputs.include_data }}" != "false" ]; then
            for f in history.csv status.json; do
              if [ -f "data/$f" ]; then cp "data/$f" _site/data/; fi
            done
          fi
          ls -la _site _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
